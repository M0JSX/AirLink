name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # libopus's bundled CMakeLists predates CMake 4's minimum; let it configure anyway.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config cmake \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install opus pkg-config cmake || true

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: airlink-${{ runner.os }}
          path: |
            target/release/airlink
            target/release/airlink.exe
          if-no-files-found: ignore
